services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.9.4"
    volumes:
      - /data/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # For accessing Bluetooth adapter https://www.home-assistant.io/integrations/bluetooth
      - /data/home-assistant/media:/media
    restart: unless-stopped
    privileged: true
    cap_add: # For better Bluetooth
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0 # Zigbee
    network_mode: host
  matterjs-server:
    container_name: matterjs-server
    image: ghcr.io/matter-js/matterjs-server:latest
    read_only: true
    volumes:
      - "/data/matter-server:/data"
    network_mode: host
    restart: unless-stopped
