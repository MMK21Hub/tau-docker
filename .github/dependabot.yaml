version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 8
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      immich:
        patterns:
          - "immich-app/*"
      beszel:
        patterns:
          - "henrygd/beszel*"
      victoria_metrics:
        patterns:
          - "victoriametrics/*"
      scanopy:
        patterns:
          - "scanopy/scanopy/*"
