services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    # This makes IPv6 easier apparently
    # network_mode: host
    restart: unless-stopped
    cap_add:
      - SETUID # Capability to change user ID; needed for using PUID
      - SETGID # Capability to change group ID; needed for using PGID
    cap_drop:
      - all
    read_only: true
    security_opt:
      - no-new-privileges:true
    env_file: secrets.env
    environment:
      - PUID=1000
      - PGID=1000
      - DOMAINS=terraria.slevel.xyz
      - PROXIED=false
